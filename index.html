<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bar.Log</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --night:#12151a; --steel:#1a2029; --steel-hi:#232b36;
  --chalk:#e9eaec; --galv:#78838f; --sodium:#f0a238; --sodium-dim:#6b4a1c; --rust:#b5563a;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --disp:'Barlow Condensed','Oswald',ui-sans-serif,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{margin:0;padding:0;background:var(--night)}
body{
  color:var(--chalk); font-family:var(--body);
  padding:0 0 130px; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
button{font-family:inherit}

.head{padding:18px 0 13px;border-bottom:1px solid var(--steel-hi);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mark{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.09em;text-transform:uppercase;line-height:1}
.mark span{color:var(--sodium)}
.meta{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--galv);text-align:right;line-height:1.6}
.meta b{color:var(--sodium);font-weight:600}
.alertbtn{margin-top:5px;background:none;border:1px solid var(--steel-hi);border-radius:2px;padding:3px 7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--galv)}
.alertbtn:active{border-color:var(--sodium);color:var(--sodium)}

.tabs{display:flex;gap:2px;margin:13px 0 0}
.tab{flex:1;padding:9px 0;background:none;border:none;border-bottom:2px solid var(--steel-hi);font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--galv)}
.tab.on{color:var(--chalk);border-bottom-color:var(--sodium)}

.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--galv);margin:20px 0 8px}
.sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--galv);margin:26px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--steel-hi)}
.note{color:var(--galv);font-size:11.5px;line-height:1.6;margin-top:12px}

.trainingDay{display:flex;align-items:center;gap:18px;margin-top:20px;padding:20px 18px;border:1px solid var(--sodium-dim);border-left:4px solid var(--sodium);border-radius:4px;background:var(--steel)}
.trainingLetter{flex:0 0 auto;font-family:var(--disp);font-size:64px;font-weight:700;line-height:1;color:var(--sodium)}
.trainingInfo{min-width:0}
.trainingLabel{font-family:var(--mono);font-size:12px;color:var(--galv);text-transform:uppercase;letter-spacing:.1em}
.trainingName{margin:4px 0 6px;font-family:var(--disp);font-size:28px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.trainingStatus{font-size:12px;color:var(--galv);line-height:1.4}
.workoutChoice{margin-top:8px}
.workoutChoice summary{display:list-item;width:fit-content;cursor:pointer;padding:10px 0;color:var(--galv);font-size:13px}
.workoutOptions{display:grid;gap:8px;margin:8px 0 16px}
.workoutOption{padding:13px 12px;background:var(--steel);border:1px solid var(--steel-hi);border-radius:3px;text-align:left;color:var(--chalk);font-size:14px;line-height:1.4}
.workoutOption:disabled{opacity:.55}
.workoutChoice summary:focus-visible,.workoutOption:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}


.daily{margin:16px 0 2px;padding:11px 13px;background:var(--steel);border-left:2px solid var(--sodium-dim);border-radius:2px;display:flex;align-items:center;gap:11px}
.daily.on{border-left-color:var(--sodium)}
.daily.toggle{width:100%;border-top:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;cursor:pointer;margin-top:22px}
.daily.toggle .dailyT,.daily.toggle .dailyS{display:block}
.ex.wristOff .exN,.ex.wristOff .exT,.ex.wristOff .chips,.ex.wristOff .exNote{opacity:.45}
.exLoad.wrist{color:var(--rust)}
.ex.maxTest{border-left:2px solid var(--sodium);padding-left:12px}
.box{width:17px;height:17px;flex-shrink:0;border-radius:2px;border:1px solid var(--galv);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--night)}
.daily.on .box{background:var(--sodium);border-color:var(--sodium)}
.dailyT{font-size:13px}
.dailyS{font-size:11px;color:var(--galv);margin-top:1px}

.ex{padding:17px 0 15px;border-bottom:1px solid var(--steel)}
.exTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.exN{font-family:var(--disp);font-weight:600;font-size:19px;line-height:1.15}
.exT{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--galv);text-align:right}
.exNote{font-size:12px;color:var(--galv);margin-top:4px;line-height:1.45}
.exLast{font-family:var(--mono);font-size:12px;color:var(--chalk);margin-top:6px;line-height:1.55}
.exLast span{color:var(--galv)}
.exLoad{font-size:12px;color:var(--sodium);margin-top:4px;line-height:1.45}
.step{margin-top:9px;padding:10px 12px;background:var(--steel);border-left:2px solid var(--sodium);border-radius:2px;font-size:12.5px;line-height:1.5;color:var(--chalk)}
.step.back{border-left-color:var(--rust)}
.step b{color:var(--sodium);font-weight:600}
.step.back b{color:var(--rust)}
.step .rowBtns{flex-wrap:wrap}
.step .miniB{min-height:36px}
.miniB.go{border-color:var(--sodium);color:var(--sodium)}
.stepWait{font-family:var(--mono);font-size:11px;color:var(--galv);margin-top:6px;line-height:1.5}
.acts.feel .btn{flex:1 1 0;min-width:0;padding:12px 4px;letter-spacing:.05em;white-space:normal;line-height:1.15}
.step .acts{margin:12px 0 4px}
.chips .chip[aria-pressed]{font-family:var(--body);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{min-width:48px;height:42px;padding:0 10px;background:var(--steel);border:1px solid var(--steel-hi);border-radius:3px;color:var(--galv);font-family:var(--mono);font-size:14px}
.chip.on{background:var(--sodium);border-color:var(--sodium);color:var(--night);font-weight:700}
.chip:active{transform:scale(.95)}
.adj{display:flex;align-items:center;gap:8px;margin-top:9px}
.adjL{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--galv)}
.adjB{width:34px;height:30px;background:var(--steel);border:1px solid var(--steel-hi);border-radius:3px;color:var(--chalk);font-size:16px;font-family:var(--mono);line-height:1;padding:0}
.adjB:active{background:var(--steel-hi)}

.acts{display:flex;gap:8px;margin:22px 0 8px}
.btn{flex:1;padding:14px 10px;border-radius:3px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;background:var(--sodium);border:1px solid var(--sodium);color:var(--night)}
.btn.ghost{background:none;border-color:var(--steel-hi);color:var(--galv);flex:0 0 auto;padding:14px 18px}
.btn:disabled{opacity:.35}
.acts.wrapb{flex-wrap:wrap}
.acts.wrapb .btn{flex:1 1 140px;padding:14px 10px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;
  max-width:calc(100% - 32px);padding:11px 16px;background:var(--steel-hi);
  border:1px solid var(--sodium-dim);border-radius:3px;color:var(--chalk);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:center;
  opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--steel);border-top:1px solid var(--steel-hi);padding-bottom:env(safe-area-inset-bottom)}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--sodium-dim);opacity:.55;transition:width 1s linear}
.timerIn{position:relative;max-width:640px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:12px}
.tD{font-family:var(--mono);font-weight:600;font-size:30px;color:var(--sodium);line-height:1;min-width:82px}
.tL{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--galv);flex:1;line-height:1.4}
.tB{padding:9px 12px;background:none;border:1px solid var(--galv);border-radius:3px;color:var(--chalk);font-family:var(--mono);font-size:11px}

.pr{padding:15px 0;border-bottom:1px solid var(--steel)}
.prTop{display:flex;align-items:baseline;justify-content:space-between}
.prN{font-family:var(--disp);font-weight:600;font-size:18px}
.prV{font-family:var(--mono);font-weight:600;font-size:24px;color:var(--sodium);line-height:1}
.prRow{display:flex;align-items:center;gap:10px;margin-top:10px}
.spark{flex:1;height:34px}
.hist{padding:12px 0;border-bottom:1px solid var(--steel);display:flex;gap:12px;align-items:baseline}
.histD{font-family:var(--mono);font-size:10px;color:var(--galv);min-width:76px}
.histS{font-family:var(--disp);font-weight:600;font-size:16px;min-width:20px}
.histX{font-size:12px;color:var(--galv);flex:1;min-width:0;overflow-wrap:anywhere}

.field{display:flex;align-items:center;gap:8px;margin-top:8px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--galv);width:52px;flex-shrink:0}
.field input,.field select,.field textarea{flex:1;min-width:0;background:var(--steel);border:1px solid var(--steel-hi);border-radius:3px;color:var(--chalk);padding:9px 10px;font-family:var(--mono);font-size:13px}
.field textarea{font-family:var(--body);min-height:56px;resize:vertical}
.rowBtns{display:flex;gap:6px;margin-top:10px}
.miniB{padding:8px 12px;background:none;border:1px solid var(--steel-hi);border-radius:3px;color:var(--galv);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.miniB.danger{border-color:var(--rust);color:var(--rust)}
.empty{color:var(--galv);font-size:13px;padding:22px 0;line-height:1.6}
textarea.dump{width:100%;height:150px;background:var(--steel);border:1px solid var(--steel-hi);border-radius:3px;color:var(--chalk);padding:10px;font-family:var(--mono);font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="timerHost"></div>

  {

        "id": "d1",
        "n": "Warm up",
        "tier": "prep",
        "sets": 1,
        "reps": 5,

        "rest": 0,

function trimNotes(plan){
  for(const session of plan){
    const def=DEFAULT_PLAN.find(p=>p.id===session.id);
    if(def&&(OLD_SESSION_NOTES[session.id]||[]).includes(session.note))session.note=def.note;
    if(def&&(OLD_SESSION_NAMES[session.id]||[]).includes(session.name))session.name=def.name;
    for(const e of session.ex){
      const old=OLD_EX_NOTES[e.id], defEx=def&&def.ex.find(x=>x.id===e.id);
      if(defEx&&(OLD_EX_NAMES[e.id]||[]).includes(e.n))e.n=defEx.n;
      if(!old||!defEx)continue;
      for(const field of ["note","progression"])
        if((old[field]||[]).includes(e[field]))e[field]=defEx[field];
    }
  }
}
function addHandstandPractice(plan){
  for(const sid of ["A","C"]){
    const session=plan.find(p=>p.id===sid); if(!session)continue;
    // Conservatively retain manually added balance work instead of replacing it.
    if(session.ex.some(e=>[sid.toLowerCase()+"2",sid.toLowerCase()+"9balance"].includes(e.id)||/hand\s*stand|hspu|straddle|balance/i.test(e.n||"")||(e.tier==="skill"&&e.id!==sid.toLowerCase()+"8")))continue;
    const warm=session.ex.findIndex(e=>e.id===sid.toLowerCase()+"1"&&e.tier==="prep");
    const lever=session.ex.findIndex(e=>e.id===sid.toLowerCase()+"8"&&/lever/i.test(e.n||""));
    if(warm<0&&lever<0)continue; // Unknown custom sequence: do not guess its structure.
    if(session.note===PULL_NOTES[sid][0])session.note=PULL_NOTES[sid][1];
    const used=new Set(plan.flatMap(p=>p.ex.map(e=>e.id)));
    const base=sid.toLowerCase()+"9balance"; let id=base, suffix=1;
    while(used.has(id))id=base+(suffix++);
    session.ex.splice(warm>=0?warm+1:lever,0,{id,n:"Easy two-arm handstand practice",tier:"skill",sets:1,reps:3,unit:"min",rest:0,budget:true,

/* Calendar weeks are independent of routine versions, rotation and target reductions. */
function dayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateNumber(value){
  if(typeof value!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(value))return null;
  const n=Date.parse(value+"T00:00:00Z");
  return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===value?n/86400000:null;
}
function datePlus(date,days){ return new Date((dateNumber(date)+days)*86400000).toISOString().slice(0,10); }
function calendarWeek(date,start=S.calendar.startDate){
  const n=dateNumber(date), a=dateNumber(start);
  return n==null||a==null||n<a?null:Math.floor((n-a)/7)+1;
}
function initCalendar(state,saved){
  if(saved.calendar&&dateNumber(saved.calendar.startDate)!=null){
    state.calendar={...saved.calendar};

    const dates=(state.history||[]).map(r=>r.date).filter(d=>dateNumber(d)!=null&&d<=dayKey()).sort();
    state.calendar={startDate:dates[0]||dayKey(),source:dates.length?"earliest-log":"new"};
  }
  state.targetMode=["normal","reduced"].includes(saved.targetMode)?saved.targetMode:
    (saved.week===4&&saved.reducedWeek4!==false?"reduced":"normal");
}
function weekText(date){ const w=calendarWeek(date); return w==null?"Before start":"Week "+w; }
function hasDraft(){ return Object.values(S.today.log||{}).some(a=>a.some(v=>v!=null)); }
function refreshDraftDate(){

    if(S.lightDate&&S.lightDate!==dayKey())endLightSession();

}
// A light session ("reduced" targets) applies to the current workout only. It turns off when
// the workout is finished, or on a later day if no set was logged. A reduced mode carried
// over from older versions has no lightDate and stays until the next finish.
function setTargetMode(value){

  const previous=S.targetMode, prevDate=S.lightDate;

/* ── max tests ──
   A regular exercise with a `max` key pairs with the benchmark of that key. A max is due
   when no result for it has been recorded in six weeks (or ever), at most one max in any
   seven days, never on a light session or wrist break. The due benchmark goes in after the
   warm-up of the first workout holding that exercise; that exercise runs light that day and
   the day never counts toward its ladder. today.maxTest: undefined = automatic, a key =
   chosen, false = switched off for this workout. */
const MAX_EVERY_DAYS=42, MAX_GAP_DAYS=7;
function lastMaxDate(key){ return (S.prs[key]||[]).map(x=>String(x.date)).sort().pop()||null; }
function lastAnyMaxDate(){
  const dates=Object.keys(S.prs).map(lastMaxDate).concat(S.history.filter(r=>r.maxTest).map(r=>String(r.date))).filter(Boolean).sort();
  return dates.pop()||null;
}
function maxCandidates(s){
  const t=S.plan.find(p=>p.testOnly); if(!t||s.testOnly)return [];
  return s.ex.map(e=>({e,b:e.max&&t.ex.find(b=>b.amrap&&b.pr===e.max)})).filter(c=>c.b);
}
function maxDue(key){
  const last=lastMaxDate(key);
  return last==null||dateNumber(dayKey())-dateNumber(last)>=MAX_EVERY_DAYS;
}
function autoMaxKey(s){
  if(S.today.wristBreak||S.targetMode==="reduced")return null;
  const any=lastAnyMaxDate();
  if(any&&dateNumber(dayKey())-dateNumber(any)<MAX_GAP_DAYS)return null;
  const c=maxCandidates(s).find(c=>maxDue(c.e.max));
  return c?c.e.max:null;
}
function maxTestToday(s){
  const key=S.today.maxTest===undefined?autoMaxKey(s):S.today.maxTest;
  return key?maxCandidates(s).find(c=>c.e.max===key)||null:null;
}
function todayExercises(s){
  const m=maxTestToday(s); if(!m)return s.ex;
  const i=s.ex.findIndex(e=>e.tier!=="prep"), at=i<0?s.ex.length:i;
  return s.ex.slice(0,at).concat([{...m.b,maxTest:true}],s.ex.slice(at));

    if(p.key&&S.progress.snooze[p.pool]===p.key)p.snoozed=true;
    if(p.kind==="up"&&!p.snoozed){
      const b=blockerFor(e,p);
      if(b){ p.kind="queued"; p.behind=b.n; p.changed=true; }
      else ready.push(e);
    }
    out[e.id]=p;
  }
  const lastChange=e=>(S.progress.log.find(x=>x.sid===s.id&&x.id===e.id&&x.to)||{}).date||"";
  const offer=ready.slice().sort((a,b)=>lastChange(a).localeCompare(lastChange(b)))[0];
  for(const e of ready)if(e!==offer){ out[e.id].kind="queued"; out[e.id].behind=offer.n; out[e.id].changed=false; }
  return out;
}
function progressNote(sid,from,to,kind,e){
  S.progress.log.unshift({date:dayKey(),sid,id:e.id,n:e.n,kind,from:fmtTargets(from,e,true),...(to?{to:fmtTargets(to,e,true)}:{})});
  S.progress.log=S.progress.log.slice(0,100);
}
function stepAction(exId,action){
  const s=sess(), e=s.ex.find(x=>x.id===exId), p=e&&sessionProgress(s)[exId];
  if(!p||p.snoozed&&action!=="later")return;
  const before=JSON.parse(JSON.stringify(S));
  const change=(list,kind)=>list.forEach(m=>{
    applyTargets(m.e,m.to); progressNote(m.sid,m.from,m.to,kind,m.e); S.progress.pending[m.sid]={id:m.e.id,date:dayKey()};
  });
  let msg="";
  if(action==="later"&&p.key){ S.progress.snooze[p.pool]=p.key; }
  else if(action==="accept"&&(p.kind==="up"||p.kind==="back")&&p.moves&&p.moves.length){
    change(p.moves,p.kind); delete S.progress.snooze[p.pool];
    msg=(p.kind==="up"?"Stepped up":"Stepped back")+" · "+e.n+" "+fmtTargets(p.to,e,true)+(p.moves.length>1?" on "+p.moves.map(m=>m.sid).join(" and "):"");
  }else if(action==="ack"&&p.kind==="milestone"){
    S.progress.acks[p.pool]=p.sig; progressNote(s.id,p.from,null,"milestone",e);
    msg="Milestone noted · "+e.n;
  }else if(action==="swap"&&p.kind==="milestone"&&p.swap){
    for(const m of ladderMembers(s.id,e)){
      const x=m.e, from=fullTargets(x), to=Array(x.sets).fill(p.swap.reps), was=x.n;
      applyTargets(x,to); x.n=p.swap.n; if(p.swap.note)x.note=p.swap.note;
      if(p.swap.trackBand)x.trackBand=true; else delete x.trackBand;
      progressNote(m.sid,from,to,"swap",{...x,n:was+" \u2192 "+x.n}); S.progress.pending[m.sid]={id:x.id,date:dayKey()};
    }
    delete S.progress.acks[p.pool];
    msg="Switched \u00b7 "+e.n+" "+fmtTargets(Array(e.sets).fill(p.swap.reps),e,true);
  }else if(action==="reset"&&p.kind==="milestone"&&p.rule.reset){
    change(ladderMembers(s.id,e).map(m=>({...m,from:fullTargets(m.e),to:Array(m.e.sets).fill(p.rule.reset)})),"reset");
    delete S.progress.acks[p.pool];
    msg="Reset · "+e.n+" "+fmtTargets(Array(e.sets).fill(p.rule.reset),e,true);
  }else return;
  if(!save()){ S=before; render(); return; }
  render();
  if(msg)toast(msg);
}
function viewStep(s,e,p,logged){
  if(!p)return "";
  const btn=(action,label,go)=>'<button class="miniB'+(go?' go':'')+'" onclick="stepAction(\''+e.id+'\',\''+action+'\')">'+label+'</button>';
  const from=esc(fmtTargets(p.from,e,true)), to=p.to?esc(fmtTargets(p.to,e,true)):"";
  const sessions=n=>n+" clean session"+(n===1?"":"s");
  const across=p.shared.length?" across "+[s.id].concat(p.shared).join(" and "):"";
  const also=p.shared.length?" Also changes "+p.shared.join(" and ")+".":"";
  if(!logged&&!p.snoozed){
    if(p.kind==="back")return '<div class="step back"><b>'+(p.reason==="sore"?"Too sore after the first session at this step ("+esc(shortD(p.date))+").":"Ache flagged "+esc(shortD(p.date))+".")+'</b> Step back to '+to+'?'+esc(also)+
      '<div class="rowBtns">'+btn("accept","Step back to "+to,true)+btn("later","Keep "+from)+'</div></div>';
    if(p.kind==="up")return '<div class="step"><b>Ready to step up.</b> '+sessions(p.need)+esc(across)+' at '+from+'. Next: '+to+'.'+esc(also)+
      '<div class="rowBtns">'+btn("accept","Step up",true)+btn("later","Not yet")+'</div></div>';
    if(p.kind==="milestone")return '<div class="step"><b>Milestone.</b> '+esc(p.rule.next)+
      '<div class="rowBtns">'+(p.swap?btn("swap","Switch to "+esc(p.swap.n)+" \u00b7 "+esc(fmtTargets(Array(e.sets).fill(p.swap.reps),e,true)),true):"")+
      (p.rule.reset?btn("reset","Switched \u00b7 reset to "+esc(fmtTargets(Array(e.sets).fill(p.rule.reset),e,true)),true):"")+btn("ack","Got it",!p.rule.reset&&!p.swap)+'</div></div>';
  }
  let line;
  if(p.kind==="top")line="Top of this ladder.";
  else if(p.kind==="queued")line=p.changed?"Step up ready after the "+p.behind+" change has been trained.":
    "Also ready. One change at a time: "+p.behind+" is offered first.";
  else if(p.snoozed&&p.kind==="back")line=p.reason==="sore"?"Kept this target after the sore day. Too sore again will offer the step back again.":"Kept this target after the ache. Flag it again if it returns.";
  else if(p.snoozed)line="Step up offered and skipped. It returns after your next clean session here.";
  else if(p.kind==="wait")line="Step up after "+sessions(p.need)+" at this target"+across+" · "+p.streak+" so far.";
  else return "";
  return '<div class="stepWait">'+esc(line)+'</div>';
}
// Next-day soreness. Asked once a day on Train before any set is logged, and stored on the
// most recent session once it finished at least four hours ago (a session after midnight
// still counts) and within three days. Sessions saved before finish times were recorded
// qualify by date alone. Too sore breaks that session's step-up streaks
// and, after the first session at a new target, offers a step back.
const SORENESS={fresh:"Fresh",sore:"A bit sore",very:"Too sore"};
const READY_AFTER_MS=4*3600000;
function readinessTarget(){
  const today=dayKey(), row=historyRows().find(({record:r})=>String(r.date)<=today);
  if(!row||String(row.record.date)<datePlus(today,-3))return null;
  const done=Date.parse(row.record.finishedAt);
  return Number.isFinite(done)&&Date.now()-done<READY_AFTER_MS?null:row.record;
}
function setSoreness(v){
  if(!SORENESS[v]&&v!=="skip")return;
  const r=readinessTarget(); if(!r)return;
  const before=JSON.parse(JSON.stringify(S));
  if(v==="skip")S.progress.readySkip=dayKey();
  else{ r.soreness=v; S.progress.readyDate=dayKey(); }
  if(!save()){ S=before; render(); return; }
  render();
}
function viewReadiness(){
  if(hasDraft()||S.progress.readySkip===dayKey())return "";
  const r=readinessTarget(); if(!r)return "";
  const answered=S.progress.readyDate===dayKey();
  if(r.soreness&&!answered)return "";
  return '<div class="step"><b>How do you feel today?</b> Logged against '+esc(r.sid)+' on '+esc(shortD(String(r.date)))+'. Too sore holds step ups from that session.'+
    '<div class="acts feel">'+Object.keys(SORENESS).map(k=>'<button class="btn '+(r.soreness===k?'':'ghost')+'" aria-pressed="'+(r.soreness===k)+'" onclick="setSoreness(\''+k+'\')">'+SORENESS[k]+'</button>').join('')+'</div>'+
    (answered?'':'<div class="rowBtns"><button class="miniB" onclick="setSoreness(\'skip\')">Skip today</button></div>')+'</div>';
}
// Finish check-in. Grindy or Ache can name the exercises involved; none named means all.
function setFeel(v){
  if(!FEELS[v])return;
  S.today.feel=S.today.feel===v?"":v;
  if(S.today.feel!=="grindy"&&S.today.feel!=="ache")delete S.today.feelEx;
  commit();
}
function toggleFeelEx(id){
  const a=S.today.feelEx||[];
  S.today.feelEx=a.includes(id)?a.filter(x=>x!==id):a.concat([id]);
  commit();
}
function viewFeel(s){
  const feel=S.today.feel||"";
  let h='<div class="lbl">How did it go?</div><div class="acts feel">'+
    Object.keys(FEELS).map(k=>'<button class="btn '+(feel===k?'':'ghost')+'" aria-pressed="'+(feel===k)+'" onclick="setFeel(\''+k+'\')">'+FEELS[k]+'</button>').join('')+'</div>';
  if(feel==="grindy"||feel==="ache"){
    const picked=S.today.feelEx||[];
    const done=s.ex.filter(e=>e.tier!=="prep"&&(S.today.log[e.id]||[]).some(v=>v!=null));
    h+='<div class="note">Which exercise? Leave all off if it was the whole session.</div><div class="chips">'+
      done.map(e=>'<button class="chip'+(picked.includes(e.id)?' on':'')+'" aria-pressed="'+picked.includes(e.id)+'" onclick="toggleFeelEx(\''+e.id+'\')">'+esc(e.n)+'</button>').join('')+'</div>';
  }
  return h+'<div class="note">Only exercises marked Clean, with every set at target, count toward a step up. Ache on a named exercise offers a step back next time.</div>';
}

/* ── check-in review ──
   Grindy and Ache flags and next-day soreness from the last six weeks, plus a suggestion
   (never an automatic switch) to make today a light session after ache or a Too sore day
   following two sessions within a week. */
function checkinWindow(weeks){
  const since=datePlus(dayKey(),-7*weeks);
  return historyRows().map(x=>x.record).filter(r=>String(r.date)>=since);
}
function checkinSummary(weeks=6){
  const rows=checkinWindow(weeks), rated=rows.filter(r=>FEELS[r.feel]), flags={};
  for(const r of rated){
    if(r.feel==="clean")continue;
    const names=r.feelEx&&r.feelEx.length?r.feelEx.map(id=>((r.detail||[]).find(x=>x.id===id)||{}).n||id):["Whole session"];
    for(const n of names){
      const f=flags[n]||(flags[n]={grindy:0,ache:0,last:""});
      f[r.feel]++; if(String(r.date)>f.last)f.last=String(r.date);
    }
  }
  const count=k=>rated.filter(r=>r.feel===k).length, sore=k=>rows.filter(r=>r.soreness===k).length;
  return {total:rows.length,rated:rated.length,clean:count("clean"),grindy:count("grindy"),ache:count("ache"),flags,
    soreness:{fresh:sore("fresh"),sore:sore("sore"),very:sore("very")},wrist:rows.filter(r=>r.wristBreak).length};
}
function reducedHint(){
  if(S.targetMode!=="normal")return null;
  const aches=checkinWindow(1).filter(r=>r.feel==="ache"||r.soreness==="very");
  if(aches.length<2)return null;
  const key=aches.map(r=>r.date).sort().pop();
  return S.progress.reducedSnooze===key?null:{count:aches.length,key};
}
function viewReducedHint(){
  const h=reducedHint(); if(!h)return "";
  return '<div class="step back"><b>Ache or too sore after '+h.count+' sessions this week.</b> Make today a light session? Light sessions don’t count toward step ups.'+
    '<div class="rowBtns"><button class="miniB go" onclick="setTargetMode(\'reduced\')">Make today light</button>'+
    '<button class="miniB" onclick="snoozeReduced()">Not now</button></div></div>';
}
function snoozeReduced(){ const h=reducedHint(); if(!h)return; S.progress.reducedSnooze=h.key; commit(); }
function viewCheckins(){
  const c=checkinSummary(), n=c.soreness, sored=n.fresh+n.sore+n.very; if(!c.rated&&!sored&&!c.wrist)return "";
  let h='<div class="sec">Check-ins · last 6 weeks</div><div class="note">Rated '+c.rated+' of '+c.total+' sessions · Clean '+c.clean+' · Grindy '+c.grindy+' · Ache '+c.ache+(c.wrist?' · Wrist break '+c.wrist:'')+'</div>';
  if(sored)h+='<div class="note">Next day: Fresh '+n.fresh+' · A bit sore '+n.sore+' · Too sore '+n.very+'</div>';
  const names=Object.keys(c.flags).sort((a,b)=>(c.flags[b].ache-c.flags[a].ache)||(c.flags[b].grindy-c.flags[a].grindy));
  names.forEach(n=>{
    const f=c.flags[n], bits=[]; if(f.ache)bits.push("Ache "+f.ache); if(f.grindy)bits.push("Grindy "+f.grindy);
    h+='<div class="hist"><span class="histX"><span style="color:var(--chalk)">'+esc(n)+'</span> · '+esc(bits.join(" · "))+'</span><span class="histD" style="min-width:0">latest '+esc(shortD(f.last))+'</span></div>';
  });
  if(!names.length&&c.rated)h+='<div class="note">No grindy or achy exercises flagged.</div>';
  return h;
}

/* ── AI coach summary ──
   Plain text for pasting into an AI assistant. Built on the device; nothing is sent anywhere. */
function coachSummary(weeks=6){
  const since=datePlus(dayKey(),-7*weeks), L=[];
  L.push("Calisthenics training log exported from Bar.Log on "+dayKey()+". "+weekText(dayKey())+" of the calendar. Light sessions use about 60% of the sets and never count toward step ups.");
  L.push("","CURRENT PLAN (A–D rotation; next up: "+nextId()+")");
  S.plan.filter(p=>!p.testOnly).forEach(p=>{
    L.push(p.id+" · "+p.name);
    p.ex.filter(e=>e.tier!=="prep").forEach(e=>{
      const dose=e.budget?e.reps+" min total":fmtTargets(fullTargets(e),e);
      const r=ladderFor(e);
      L.push("- "+e.n+": "+dose+(e.rest?", rest "+e.rest+"s":"")+(e.optional?", optional":"")+(r?", ladder top "+r.top+unitOf(e):""));
    });
  });
  const rows=historyRows().map(x=>x.record).filter(r=>String(r.date)>=since);
  const switches=(S.planArchives||[]).map(x=>String(x.savedAt||"").slice(0,10)).filter(d=>d>=since).sort();
  if(switches.length)L.push("","Routine changed on "+switches.join(", ")+". Sessions before that follow the earlier plan, so exercise names and doses differ.");
  L.push("","SESSIONS SINCE "+since+" (newest first; check-in and next-day soreness in brackets)");
  if(!rows.length)L.push("None.");
  rows.forEach(r=>{
    const next=SORENESS[r.soreness]?"; next day: "+SORENESS[r.soreness].toLowerCase():"";
    const feel=" ["+(FEELS[r.feel]?FEELS[r.feel]+(r.feelEx&&r.feelEx.length?": "+r.feelEx.map(id=>((r.detail||[]).find(x=>x.id===id)||{}).n||id).join(", "):""):"not rated")+next+"]";
    L.push(r.date+" "+r.sid+(r.targetMode==="reduced"?" light session":"")+(r.wristBreak?" wrist break":"")+(r.maxTest&&PRS[r.maxTest]?" (max test: "+PRS[r.maxTest][0].toLowerCase()+")":"")+(r.manual?" (logged later)":"")+feel);
    (r.detail||[]).filter(x=>x.unit!=="min").forEach(x=>{
      const missed=Array.isArray(x.target)&&!metTarget(x);
      L.push("  "+x.n+(x.variant?" ("+x.variant.toLowerCase()+")":"")+": "+x.sets.join(",")+(x.unit==="reps"?"":x.unit)+(missed?" (target "+x.target.join(",")+")":"")+(x.band?" band "+x.band:""));
    });
    if(r.note)L.push("  Note: "+r.note);
  });
  const steps=S.progress.log.filter(x=>x.date>=since);
  L.push("","STEP UPS AND MILESTONES");
  L.push(...(steps.length?steps.map(x=>x.date+" "+x.sid+" "+x.n+": "+(STEP_KINDS[x.kind]||x.kind)+" "+x.from+(x.to?" → "+x.to:"")):["None."]));
  const maxes=Object.keys(PRS).filter(k=>(S.prs[k]||[]).length).map(k=>{const l=S.prs[k][S.prs[k].length-1];return PRS[k][0]+" "+l.value+PRS[k][1]+" ("+l.date+")";});
  L.push("","LATEST MAXES",maxes.length?maxes.join("; "):"None recorded.");
  L.push("","My question: ");
  return L.join("\n");
}
function shareCoach(){
  const t=coachSummary();

/* ── screen awake ──
   Keeps the screen on while a workout has logged sets, so the rest timer and its alert
   stay live between sets. The browser drops the lock when the app is hidden; it is taken
   again on return. */
let wakeLock=null;
function syncAwake(){
  const want=!!(S&&hasDraft());
  if(!navigator.wakeLock)return;
  if(want&&!wakeLock&&document.visibilityState==="visible"){
    wakeLock="pending";
    navigator.wakeLock.request("screen").then(l=>{
      if(!hasDraft()){ l.release().catch(()=>{}); wakeLock=null; return; }
      wakeLock=l; l.addEventListener("release",()=>{ if(wakeLock===l)wakeLock=null; });
    },()=>{ wakeLock=null; });
  }else if(!want&&wakeLock&&wakeLock!=="pending"){
    const l=wakeLock; wakeLock=null; l.release().catch(()=>{});
  }
}

/* ── alert ── */
function ding(){
  if(S.alert==="off")return;
  if(navigator.vibrate)navigator.vibrate([130,90,130]);
  if(S.alert!=="sound"||!ac)return;
  try{
    [0,.24].forEach(o=>{
      const osc=ac.createOscillator(),g=ac.createGain();
      osc.type="sine"; osc.frequency.value=680;
      g.gain.setValueAtTime(.0001,ac.currentTime+o);
      g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+o+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+o+.2);
      osc.connect(g); g.connect(ac.destination);
      osc.start(ac.currentTime+o); osc.stop(ac.currentTime+o+.22);
    });
  }catch(e){}
}
function unlockAudio(){
  if(S.alert!=="sound")return;
  try{ if(!ac){const A=window.AudioContext||window.webkitAudioContext; if(A)ac=new A();}
    if(ac&&ac.state==="suspended")ac.resume(); }catch(e){}
}

/* ── timer ── */
function startRest(secs,label){
  unlockAudio();
  if(!secs)return;
  timer={end:Date.now()+secs*1000,total:secs,left:secs,label:label};
  if(tick)clearInterval(tick);
  tick=setInterval(()=>{
    const left=Math.round((timer.end-Date.now())/1000);
    if(left<=0){ clearInterval(tick); tick=null; timer=null; ding(); drawTimer(); return; }
    timer.left=left; drawTimer();
  },250);
  drawTimer();
}
function stopTimer(){ if(tick)clearInterval(tick); tick=null; timer=null; drawTimer(); }
function addTime(){ if(!timer)return; timer.end+=30000; timer.total+=30; timer.left+=30; drawTimer(); }

function drawTimer(){
  const host=document.getElementById("timerHost");
  if(!timer){ host.innerHTML=""; return; }
  const pct=Math.max(0,(timer.left/timer.total)*100);
  host.innerHTML=
   '<div class="timer"><div class="fill" style="width:'+pct+'%"></div><div class="timerIn">'+
   '<span class="tD">'+String(Math.floor(timer.left/60)).padStart(2,"0")+":"+String(timer.left%60).padStart(2,"0")+'</span>'+
   '<span class="tL">'+esc(timer.label)+'</span>'+
   '<button class="tB" onclick="addTime()">+30</button>'+
   '<button class="tB" onclick="stopTimer()">Skip</button></div></div>';
}

/* ── logging ── */
// Benchmark entries are measured results, never preset targets.
function benchmarkField(e,idx,value){
  const id='today-'+e.id+'-'+idx;
  return '<div class="field"><label for="'+esc(id)+'">'+(e.unit==='reps'?'Reps':'Seconds')+'</label>'+
    '<input id="'+esc(id)+'" aria-label="'+esc(e.n)+' result '+(idx+1)+'" type="number" min="0" step="'+(e.unit==='reps'?'1':'any')+'" inputmode="'+(e.unit==='reps'?'numeric':'decimal')+'" placeholder="Your result" value="'+(value==null?'':value)+'" oninput="recordBenchmark(\''+e.id+'\','+idx+',this.value)"></div>';
}
function recordBenchmark(exId,idx,raw){
  const e=todayExercises(sess()).find(e=>e.id===exId);if(!e||!e.amrap)return;
  const n=Number(raw), valid=raw.trim()!==''&&Number.isFinite(n)&&n>=0&&(e.unit!=='reps'||Number.isInteger(n));
  const previous=JSON.parse(JSON.stringify(S.today.log));
  refreshDraftDate();
  const arr=(S.today.log[exId]||[]).slice();arr[idx]=valid?n:null;S.today.log[exId]=arr;
  if(!save()){S.today.log=previous;render();return;}
  const finishButton=document.getElementById('finishSession');
  if(finishButton)finishButton.disabled=!todayExercises(sess()).some(e=>(S.today.log[e.id]||[]).some(v=>v!=null));
}
function logSet(exId,idx,target){
  refreshDraftDate();
  unlockAudio();
  const e=sess().ex.find(x=>x.id===exId);
  const arr=(S.today.log[exId]||[]).slice();

function finish(){
  refreshDraftDate();
  const s=sess(), log=S.today.log;
  const before=JSON.parse(JSON.stringify(S));
  if(!todayExercises(s).some(e=>(log[e.id]||[]).some(v=>typeof v==="number")))return;
  let reps=0, secs=0;
  const detail=[];
  const maxed=maxTestToday(s);
  todayExercises(s).forEach(e=>{
    const vals=(log[e.id]||[]).filter(v=>typeof v==="number");
    if(!vals.length)return;
    const sum=vals.reduce((a,b)=>a+b,0);
    if(e.unit==="reps")reps+=sum; else if(e.unit==="s")secs+=sum;
    const item={id:e.id,n:e.n,unit:e.unit,sets:vals};
    const variant=nextVariant(s.id,e); if(variant)item.variant=variant;
    if(!e.amrap)item.target=fullTargets(e);
    const band=S.today.band&&S.today.band[e.id]&&S.today.band[e.id].trim();
    if(band)item.band=band;
    detail.push(item);
    if(e.pr)S.prs[e.pr]=(S.prs[e.pr]||[]).concat([{date:S.today.date||dayKey(),value:Math.max.apply(null,vals)}]);
  });
  openHist=-1;
  const feel=FEELS[S.today.feel]?{feel:S.today.feel,...(S.today.feelEx&&S.today.feelEx.length?{feelEx:S.today.feelEx.slice()}:{})}:{};
  if(S.today.wristBreak)feel.wristBreak=true;
  if(maxed)feel.maxTest=maxed.e.max;
  S.history.unshift({date:S.today.date||dayKey(),finishedAt:new Date().toISOString(),sid:s.id,week:calendarWeek(S.today.date||dayKey()),weekSource:"calendar",targetMode:S.targetMode,reps:reps,secs:secs,detail:detail,...feel,...(S.today.rice?{rice:true}:{})});
  // Keep older entries; backups include the complete history.
  if(!s.testOnly)advanceAfter(s.id);
  const pend=S.progress.pending[s.id];
  const pendEx=pend&&s.ex.find(e=>e.id===pend.id)||{};
  if(!(S.today.wristBreak&&pendEx.wrist)&&!(maxed&&pendEx.max===maxed.e.max))delete S.progress.pending[s.id];
  endLightSession();
  S.today={date:dayKey(),sid:nextId(),log:{},band:{},rice:S.today.rice};
  if(!save()){S=before;render();return;}
  pendingSession=null;stopTimer(); tab="progress"; render();
  const ready=Object.entries(sessionProgress(s)).filter(([,p])=>["up","back","milestone"].includes(p.kind)&&!p.snoozed)
    .map(([id])=>s.ex.find(e=>e.id===id).n);
  if(ready.length)toast("Next "+s.id+": suggestion ready for "+ready.join(", "));
}

/* ── data ── */
let persistState="checking", persistUsage=null;
function persistNote(){
  const b=(t,c)=>'<b style="color:'+(c||"var(--chalk)")+'">'+t+'</b>';
  const used=(persistUsage!=null&&persistUsage>=1024)?" Using "+fmtBytes(persistUsage)+".":"";
  if(persistState==="checking")return "Checking whether the browser will hold on to this log\u2026";
  if(persistState==="granted")
    return "This log is "+b("protected","var(--sodium)")+"."+used+
      " The browser has agreed not to clear it to reclaim space. Clearing site data by hand still wipes it.";
  if(persistState==="denied")
    return "This log is "+b("not protected")+"."+used+
      " The browser may clear it if the device runs low on space. Installing it to your home screen and asking again usually gets it granted.";
  return "This browser "+b("can\u2019t say")+" whether the log is protected."+used+
    " Back it up regularly either way.";
}
async function checkPersist(){
  if(!navigator.storage||!navigator.storage.persisted){ persistState="unsupported"; return; }
  try{
    persistState=(await navigator.storage.persisted())?"granted":"denied";
    if(navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      if(e&&e.usage!=null)persistUsage=e.usage;
    }
  }catch(e){ persistState="unsupported"; }
}
async function askPersist(){
  if(!navigator.storage||!navigator.storage.persist){ toast("This browser can't report storage protection"); return; }
  try{
    const ok=await navigator.storage.persist();
    persistState=ok?"granted":"denied";
    toast(ok?"Storage protected \u2014 the browser won't evict your log"
            :"Browser said no \u2014 install to the home screen, then try again");
  }catch(e){ persistState="unsupported"; toast("Couldn't ask this browser"); }
  render();
}
function fmtBytes(n){
  if(n==null)return "";
  return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
}

let toastT=null;

function legacyCopy(t){
  const ta=document.createElement("textarea");
  ta.value=t; ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
  document.body.appendChild(ta);
  ta.select(); try{ ta.setSelectionRange(0,t.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function copyData(){
  const t=snapshot();
  const ok=()=>{ markBackup(); toast("Backup copied to clipboard"); };
  const no=()=>toast("Copy blocked — use Export file or Share");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok,()=>{ legacyCopy(t)?ok():no(); });
  }else{
    legacyCopy(t)?ok():no();
  }
}

// Browsers only share files of listed types: Chrome refuses .json but accepts plain text,
// so the backup is shared as a .txt file holding the same JSON (restore reads either).
// A share can't be retried after a failure (the tap no longer counts), so any failure
// other than cancelling saves the file to Downloads instead.
function shareData(){
  const name=backupName().replace(/\.json$/,".txt");
  let file=null;
  try{ file=new File([snapshot()],name,{type:"text/plain"}); }catch(e){}
  const saveInstead=()=>{ exportData(); toast("Couldn\u2019t share \u2014 saved to Downloads instead"); };
  if(!navigator.share||!file||!navigator.canShare||!navigator.canShare({files:[file]})){ saveInstead(); return; }
  navigator.share({files:[file],title:name}).then(markBackup,e=>{ if(!e||e.name!=="AbortError")saveInstead(); });
}

function applyBackup(text){
  const t=(text||"").trim();
  if(!t){ toast("Nothing to restore"); return; }
  let p;
  try{ p=JSON.parse(t); }catch(e){ alert("Could not read that: "+e.message); return; }
  if(!p||!Array.isArray(p.plan)||!p.plan.length||!p.plan.every(s=>s&&s.id&&Array.isArray(s.ex)&&s.ex.every(e=>e&&e.id&&["reps","s","min"].includes(e.unit)))||!p.today||!Array.isArray(p.history)){ alert("Could not read that: not a Bar.Log backup"); return; }
  if(!confirm("Replace everything currently stored with this backup?"))return;
  const fromVersion=Number(p.planVersion||1);
  stopTimer();
  S=migrate(Object.assign(blank(),p),fromVersion,p); storageBlocked=false;
  historyMode="recent"; historyMonth=""; historySession=""; historyPage=0; openHist=-1; commit();
  toast("Restored");
}
function importData(){
  const b=document.getElementById("importBox");
  applyBackup(b?b.value:"");
}

function fileChosen(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  const done=()=>{ try{ inp.value=""; }catch(e){} };
  if(f.text){
    f.text().then(t=>{ applyBackup(t); done(); },()=>{ toast("Could not read that file"); done(); });
  }else{
    const r=new FileReader();
    r.onload=()=>{ applyBackup(String(r.result)); done(); };
    r.onerror=()=>{ toast("Could not read that file"); done(); };
    r.readAsText(f);
  }
}

/* ── sparkline ── */
function spark(pts){
  if(!pts||pts.length<2)return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><line x1="0" y1="33" x2="100" y2="33" stroke="#232b36" stroke-width="1"/></svg>';
  const mx=Math.max.apply(null,pts),mn=Math.min.apply(null,pts),sp=(mx-mn)||1;
  const d=pts.map((p,i)=>(i?"L":"M")+((i/(pts.length-1))*100).toFixed(1)+","+(30-((p-mn)/sp)*26).toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="#f0a238" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}

// Most recent logged results for this exercise in this session, newest first.
// Older records have no exercise ID, so they match on name and unit instead.
function lastExposures(sid,e,max){
  const out=[];
  for(const {record:r} of historyRows()){
    if(r.sid!==sid||!r.detail)continue;
    const x=r.detail.find(d=>d.id?d.id===e.id:d.n===e.n&&d.unit===e.unit);
    if(!x||!x.sets||!x.sets.length)continue;
    out.push({date:String(r.date),x,r});
    if(out.length>=max)break;
  }
  return out;
}
// Alternating variants (for example grip). The next one follows whatever the last session
// of this exercise recorded; a session logged before variants existed counts as the first.
const altOf=e=>Array.isArray(e.alt)&&e.alt.length>1&&e.alt.every(v=>typeof v==="string"&&v)?e.alt:null;
function nextVariant(sid,e){
  const alt=altOf(e); if(!alt)return null;
  const last=lastExposures(sid,e,1)[0]; if(!last)return alt[0];
  const i=alt.indexOf(last.x.variant);
  return alt[((i<0?0:i)+1)%alt.length];
}
function viewLast(sid,e){
  if(e.tier==="prep")return "";
  const seen=lastExposures(sid,e,2);
  if(!seen.length)return "";
  return '<div class="exLast">'+seen.map(({date,x,r},i)=>
    '<div><span>'+(i?"Before":"Last")+' '+esc(shortD(date))+'</span> '+esc(x.sets.join(", "))+esc(x.unit==="reps"?"":x.unit)+
    (x.variant?' <span>· '+esc(x.variant.toLowerCase())+'</span>':'')+(r.wristBreak&&e.wrist?' <span>· wrist break</span>':'')+(r.maxTest&&e.max===r.maxTest?' <span>· max day</span>':'')+
    (x.band?' <span>· band '+esc(x.band)+'</span>':'')+'</div>').join("")+'</div>';
}

}

function viewHistory(){
  const visible=historyWindow();
  let h='<div class="sec">'+(historyMode==="recent"?'Recent workouts':'Browse history')+'</div>';
  h+='<div class="acts"><button class="btn ghost" onclick="browseHistory('+(historyMode==="recent"?'true':'false')+')">'+(historyMode==="recent"?'Browse history':'Back to recent')+'</button></div>';
  if(historyMode==="browse"){
    const months=[...new Set(S.history.map(r=>String(r.date).slice(0,7)).concat(historyMonth?[historyMonth]:[]))].sort().reverse();
    const sessions=[...new Set(S.history.map(r=>r.sid).concat(historySession?[historySession]:[]))].sort();
    h+='<div class="field"><label for="historyMonth">Month</label><select id="historyMonth" onchange="filterHistory(\'month\',this.value)"><option value="">All months</option>'+months.map(m=>'<option value="'+esc(m)+'"'+(m===historyMonth?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div>'+
      '<div class="field"><label for="historySession">Workout</label><select id="historySession" onchange="filterHistory(\'session\',this.value)"><option value="">All sessions</option>'+sessions.map(id=>'<option value="'+esc(id)+'"'+(id===historySession?' selected':'')+'>'+esc(id)+'</option>').join('')+'</select></div>';
  }
  if(!visible.rows.length)h+='<div class="empty">'+(S.history.length?'No workouts match these filters.':'Nothing logged yet.')+'</div>';
  else h+='<div class="note">'+(historyMode==="recent"?'Latest '+visible.rows.length+' of '+S.history.length+' saved workouts':visible.total+' matching workouts')+' · tap a row for details.</div>';
  visible.rows.forEach(({record:r,index:i})=>{
    const rp=r.reps!=null?r.reps:(r.total||0), sc=r.secs||0;
    const bits=[]; if(rp)bits.push(rp+" reps"); if(sc)bits.push(sc+"s");
    const hasD=r.detail&&r.detail.length;
    const expandable=true;
    h+='<div class="hist"'+(expandable?' role="button" tabindex="0" aria-expanded="'+(openHist===i)+'" onkeydown="if(event.target===this&&(event.keyCode===13||event.keyCode===32)){event.preventDefault();expandHist('+i+')}" onclick="expandHist('+i+')" style="cursor:pointer"':'')+'>'+
       '<span class="histD">'+esc(r.date)+'</span><span class="histS">'+esc(r.sid)+'</span>'+
       '<span class="histX">'+esc(weekText(r.date))+(bits.length?" · "+bits.join(" · "):"")+(r.manual?" · by hand":"")+
       (expandable?(openHist===i?" ▾":" ▸"):"")+'</span>'+
       '<button class="miniB" aria-label="Delete workout" onclick="event.stopPropagation();delHist('+i+')">×</button></div>';
    if(openHist===i){
      h+='<div style="padding:6px 0 12px 68px;border-bottom:1px solid var(--steel)">';
      if(r.weekSource!=="calendar"&&r.week!=null)h+='<div class="note">Original logged label: week '+esc(r.week)+'. Calendar label above comes from the workout date.</div>';
      if(r.targetMode)h+='<div class="note">'+(r.targetMode==="reduced"?'Light session':'Full session')+(FEELS[r.feel]?' · '+esc(FEELS[r.feel])+(r.feelEx&&r.feelEx.length?': '+esc(r.feelEx.map(id=>(r.detail||[]).find(x=>x.id===id)?.n||id).join(', ')):''):'')+(r.wristBreak?' · Wrist break':'')+(r.maxTest&&PRS[r.maxTest]?' · Max test: '+esc(PRS[r.maxTest][0]):'')+(SORENESS[r.soreness]?' · next day '+esc(SORENESS[r.soreness].toLowerCase()):'')+'</div>';
      if(r.note)h+='<div style="font-size:12px;color:var(--galv);padding:0 0 8px;line-height:1.45">'+esc(r.note)+'</div>';
      if(r.rice)h+='<div style="font-size:11px;color:var(--sodium);padding:0 0 8px">Rice bag ✓</div>';
      if(hasD)r.detail.forEach(x=>{
        h+='<div style="font-size:12px;color:var(--galv);padding:3px 0"><span style="color:var(--chalk)">'+esc(x.n)+'</span> · '+
           esc(x.sets.join(", "))+(x.unit==="reps"?"":esc(x.unit))+(x.variant?" · "+esc(x.variant.toLowerCase()):"")+(x.band?" · band "+esc(x.band):"")+'</div>';
      });
      if(!hasD&&!r.note&&!r.rice)h+='<div style="font-size:12px;color:var(--galv)">No exercise detail logged.</div>';
      h+='<div class="field"><label>Date</label>'+
         '<input type="date" value="'+esc(r.date)+'" max="'+dayKey()+'" onchange="setHistDate('+i+',this.value)"></div>';
      h+='</div>';
    }
  });

  if(historyMode==="browse"&&visible.total)h+='<div class="acts"><button class="btn ghost" '+(historyPage===0?'disabled':'')+' onclick="pageHistory(-1)">Previous</button><span class="note">Page '+(historyPage+1)+' of '+visible.pages+'</span><button class="btn ghost" '+(historyPage===visible.pages-1?'disabled':'')+' onclick="pageHistory(1)">Next</button></div>';
  return h;
}

const STEP_KINDS={up:"Stepped up",back:"Stepped back",reset:"Reset",swap:"Switched",milestone:"Milestone"};
function viewSteps(){
  const log=S.progress.log.slice(0,8);
  let h='<div class="sec">Step ups and milestones</div>';
  if(!log.length)return h+'<div class="empty">No changes yet. Suggestions appear on an exercise in Train once its sessions are marked Clean at target.</div>';
  log.forEach(x=>{
    h+='<div class="hist"><span class="histD">'+esc(x.date)+'</span><span class="histS">'+esc(x.sid)+'</span>'+
       '<span class="histX"><span style="color:var(--chalk)">'+esc(x.n)+'</span> · '+esc(STEP_KINDS[x.kind]||x.kind)+' · '+
       esc(x.from)+(x.to?' → '+esc(x.to):'')+'</span></div>';
  });
  return h;
}
function viewProgress(){
  let h=viewBackupNudge()+viewHistory()+viewSteps()+viewCheckins()+'<div class="sec">Maxes</div>';
  Object.keys(PRS).forEach(k=>{
    const list=S.prs[k]||[], last=list.length?list[list.length-1].value:null;
    h+='<div class="pr"'+(list.length?' onclick="togglePr(\''+k+'\')" style="cursor:pointer"':'')+'>'+
       '<div class="prTop"><span class="prN">'+PRS[k][0]+'</span>'+
       '<span class="prV">'+(last==null?"—":last+PRS[k][1])+'</span></div>'+
       '<div class="prRow">'+spark(list.map(p=>p.value))+
       '<span class="adjL">'+(list.length?list.length+" test"+(list.length>1?"s":"")+(openPr===k?" ▾":" ▸"):"untested")+'</span></div></div>';
    if(openPr===k&&list.length){
      h+='<div style="padding:4px 0 14px;border-bottom:1px solid var(--steel)">';
      list.forEach((entry,idx)=>{
        h+='<div class="field"><label>'+esc(String(entry.value)+PRS[k][1])+'</label>'+
           '<input type="date" value="'+esc(entry.date)+'" max="'+dayKey()+'" onchange="setMaxDate(\''+k+'\','+idx+',this.value)">'+
           '<button class="miniB danger" onclick="delMax(\''+k+'\','+idx+')">×</button></div>';
      });
      h+='<div class="note" style="margin-top:10px">Latest by date is the one shown as your max. Fix a wrong date here, or drop the entry.</div></div>';
    }
  });
  h+='<div class="note">Maxes fill in from an optional benchmark session, available whenever you choose. Existing records are kept; default targets are not personal records.</div>';
  h+='<div class="sec">Log a max by hand</div>'+
     '<div class="note">For a max you hit outside a Test day, or one you forgot to record.</div>'+
     '<div class="field"><label>Lift</label><select id="mxLift" onchange="mxLift=this.value">'+
       Object.keys(PRS).map(k=>'<option value="'+k+'"'+(k===mxLift?" selected":"")+'>'+PRS[k][0]+'</option>').join("")+'</select>'+
     '<label style="width:38px">Value</label><input id="mxVal" type="number" step="1" inputmode="numeric" placeholder="0" value="'+esc(mxVal)+'" oninput="mxVal=this.value"></div>'+
     '<div class="field"><label>Date</label><input id="mxDate" type="date" value="'+esc(mxDate||dayKey())+'" max="'+dayKey()+'" oninput="mxDate=this.value"></div>'+
     '<div class="acts"><button class="btn" onclick="addMax()">Add max</button></div>';

  h+='<div class="sec">Review with AI</div>'+
     '<div class="note">A plain-text summary of your plan and the last six weeks: sets, check-ins, step ups and maxes. Share it to your AI app, add your question, and ask for a review. It is built on this device and only goes where you send it.</div>'+
     '<div class="acts">'+(navigator.share?'<button class="btn" onclick="shareCoach()">Share summary</button><button class="btn ghost" onclick="copyCoach()">Copy</button>':'<button class="btn" onclick="copyCoach()">Copy summary</button>')+'</div>';
  return h;
}

function viewData(){
  const canShare=!!navigator.share;
  return '<div class="sec">Saved plans</div><div class="note">Switching plans keeps history and maxes. Restore brings back that plan, its unfinished log and rotation; your calendar and target mode stay unchanged. Your current plan and draft are archived in turn. Export includes these saved plans.</div>'+
    (S.planArchives||[]).map((a,i)=>'<div class="note">'+esc(a.savedAt)+' · version '+esc(a.planVersion)+' <button class="miniB" onclick="restorePlan('+i+')">Restore saved plan '+(i+1)+'</button></div>').join('')+
    '<div class="sec">Storage</div>'+
    '<div class="note">'+persistNote()+'</div>'+
    (persistState==="granted"||persistState==="checking"?'':
      '<div class="acts"><button class="btn ghost" style="flex:1" onclick="askPersist()">Ask the browser to protect it</button></div>')+
    viewInstall()+
    '<div class="sec">Backup</div>'+
    '<div class="note"><b style="color:var(--chalk)">'+esc(backupStatus())+'</b></div>'+
    '<div class="note">Everything lives in this browser only. Clearing site data or switching phones loses it, so move a copy off the device now and then. '+
      (canShare?'Share hands the file straight to AirDrop, Messages or Files.':'Copy puts the whole backup on the clipboard.')+'</div>'+
    '<div class="acts wrapb"><button class="btn" onclick="exportData()">Export file</button>'+
      '<button class="btn ghost" onclick="copyData()">Copy</button>'+
      (canShare?'<button class="btn ghost" onclick="shareData()">Share</button>':'')+
    '</div>'+
    '<div class="sec">Restore</div>'+
    '<div class="note">Open a backup file, or paste its contents below. Either way it replaces everything currently stored.</div>'+
    '<input type="file" id="importFile" accept="application/json,.json,text/plain,.txt" style="display:none" onchange="fileChosen(this)">'+
    '<div class="acts"><button class="btn" onclick="pickFile()">Import from file</button></div>'+
    '<textarea class="dump" id="importBox" placeholder="{ ... }"></textarea>'+
    '<div class="acts"><button class="btn ghost" onclick="importData()" style="flex:1">Restore from paste</button></div>'+
    '<div class="sec">Danger</div>'+
    '<div class="acts"><button class="btn ghost danger" onclick="wipe()" style="flex:1;border-color:#b5563a;color:#b5563a">Erase everything</button></div>';
}

/* ── boot ── */
load();
if(!hasDraft()&&!S.today.selectionConfirmed)S.today.sid=nextId();
refreshDraftDate();
save();
render();
let lastCalendarDay=dayKey();
function refreshCalendarDay(){
  if(lastCalendarDay===dayKey())return;
  lastCalendarDay=dayKey();refreshDraftDate();save();render();
}
if(window.addEventListener)window.addEventListener("focus",refreshCalendarDay);
if(document.addEventListener)document.addEventListener("visibilitychange",()=>{if(!document.hidden){refreshCalendarDay();syncAwake();}});
if(window.addEventListener)window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installPrompt=e; if(tab==="data")render(); });
setInterval(refreshCalendarDay,60000);
checkPersist().then(()=>{ if(tab==="data")render(); });
if(navigator.serviceWorker&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(e=>console.error("offline cache unavailable",e));
</script>
</body>
</html>
