name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suites
        run: |
          set -e
          for suite in regression calendar benchmarks rotation progression tools; do
            node "tests/$suite.cjs"
          done
